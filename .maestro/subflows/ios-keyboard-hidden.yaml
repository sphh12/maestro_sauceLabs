appId: com.saucelabs.mydemo.app.ios
---
# 재사용 조각(iOS 전용): 소프트키보드가 내려갈 때까지 기다린다.
# inputText 다음에 오는 탭(입력란·버튼) '직전'에 호출한다. 화면의 첫 입력 전에는 키보드가 없어 필요 없다.
#
# 왜 필요한가 — iOS CI 실패의 원인 (CHANGELOG 2026-11-05):
#   키보드는 백그라운드 idb Escape 루프가 내리는데, inputText 직후 다음 탭까지의 간격이
#   루프 주기보다 짧으면 키보드가 아직 떠 있다. 그 상태에서 화면 아래쪽(City·Zip·Country,
#   To Payment, 결제 입력란)을 탭하면 탭이 키보드 자판에 떨어져 글자가 하나 찍히고,
#   이후 입력이 엉뚱한 칸으로 들어간다. 실측: City='Seould12345'(Zip 좌표 → 'd' 키),
#   Country='South Koreav'(To Payment → 'v' 키) → 검증 오류로 결제 화면 미진입.
#
# 판단 기준: 서로 다른 신호 두 가지를 쓴다 — 한쪽이 어떤 자판에서 안 보여도 다른 쪽이 잡게 하려는 것이다.
#   ①은 id, ③은 라벨로 본다. 일부러 다르게 둔 것이니 하나로 맞추지 말 것.
#   - ① id "delete|inputView" (id 는 정규식이라 '|' 로 묶는다)
#       delete     글자 자판의 '지우기' 키. Maestro 자체 hideKeyboard 의 판단 기준과 같다(IOSDriver.isKeyboardHidden).
#       inputView  키보드 영역과 같은 크기로 놓이는 빈 요소(자식 없음). 글자 자판·숫자 키패드 모두 키보드가 뜬 동안 있다.
#                  iOS 내부 식별자라 iOS 가 바뀌면 사라질 수 있다 — 그래서 ③은 다른 기준으로 둔다.
#   - ③ text "delete" (대소문자 무시) — 지우기 키의 라벨. 글자 자판은 'delete', 숫자 키패드는 'Delete' 다.
#       라벨은 시뮬레이터 언어를 따른다(영어 기준). 다른 언어에서는 ①만 동작한다.
#   id "delete" 하나만 보던 때는 숫자 키패드(Zip Code·Card Number 입력란)를 놓쳤다 — 숫자 키패드의 지우기 키에는 id 가 없고
#   라벨만 있다. 2026-11-10 야간 런 42742652630 이 이 틈으로 실패했다: Zip 입력 뒤 Escape 가 14초 끊겼는데
#   대기는 '키보드 없음'으로 바로 통과했고, Country 탭은 키패드 '6' 에, To Payment 탭은 '8' 에 떨어졌다
#   (Zip Code='123456South Korea8', Country 는 빈 칸 → 결제 화면 미진입).
#   근거(CI 아티팩트의 iOS 화면 구조 70개): 키보드가 뜬 5개(글자 자판 2·숫자 키패드 3)는 두 기준이 모두 잡고,
#   키보드가 없는 65개에는 두 기준 모두 맞는 요소가 없다.
# optional 이 아니다 — 상한 안에 안 내려가면 Escape 루프 이상이므로, 자판을 눌러 엉뚱한
#   값을 넣고 나중에 실패하는 대신 여기서 원인이 드러나게 멈춘다.
# 대기 상한 60초 (10초 → 2026-11-09 30초 → 2026-11-10 60초) — CI 러너에서 idb Escape 호출이 길게 막힌다(ios-esc-loop.log 실측):
#   런 42576946492 호출 1회 최대 20.9초, 런 42739928304 최대 40.8초(플로우 중 Escape 공백 26.6초).
#   키보드는 막혔던 Escape 가 도착한 직후 내려갔다. 10초 대기는 이 막힘과 겹쳐 실패했고(11-05·11-07 잔여 실패),
#   30초는 실측 최대보다 짧다. 상한은 최대치일 뿐이다 — 키보드가 내려가면 바로 다음 스텝으로 넘어간다(대부분 1~5초).
#   키보드 대기는 앱 동작이 아니라 테스트 우회 장치라, 늘려도 회귀 감지력은 그대로다.
# 시간 계산 주의 — Maestro 는 timeout 을 그 스텝이 시작된 때가 아니라 '마지막 조작(직전 inputText 가 끝난 때)'부터 잰다
#   (Orchestra.adjustedToLatestInteraction. 대기·확인 스텝은 이 기준 시각을 갱신하지 않는다). 그래서
#   - ①과 ③은 60초를 각자 쓰지 않고 한 창을 나눠 쓴다. ①이 50초 걸리면 ③에는 10초쯤 남는다
#   - ②의 timeout 은 ①을 지나는 동안 이미 다 쓰여, 실제로는 화면 조회 1회로 끝난다

# ① 키보드가 떠 있으면 내려갈 때까지 기다린다
- extendedWaitUntil:
    notVisible:
      id: "delete|inputView"
    timeout: 60000

# ② 잠깐 둔다 — 화면 조회 1회 분량(CI 실측 1~2초, 위 '시간 계산 주의'). 두 가지 틈을 메운다.
#    - 지우기 키는 내려가는 애니메이션 시작 시점에 화면 구조에서 사라지므로, 자판이 아직 그려져 있을 수 있다
#    - 확인 시점에 키보드가 '아직 안 올라온' 상태였을 수 있다(없음 = 내려감 / 아직 안 뜸 구분 불가)
#    sleep 커맨드가 없어 존재하지 않는 요소를 찾게 한다(optional → 경고만 남김).
#    화면 조회가 빠른 환경(로컬 Mac)에서는 이 간격이 더 짧다 — 로컬에서 탭이 자판에 떨어지면 여기부터 볼 것.
- extendedWaitUntil:
    visible: "__wait_for_keyboard_settle__"
    timeout: 700
    optional: true

# ③ 그 사이 키보드가 (다시) 올라왔으면 내려갈 때까지 기다린다 — ①과 다른 기준(라벨)으로 본다
- extendedWaitUntil:
    notVisible:
      text: "delete"
    timeout: 60000
